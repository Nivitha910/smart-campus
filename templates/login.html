{% extends "base.html" %}{% block title %}Login | Smart Campus{% endblock %}
{% block content %}
<div class="auth-card"><div class="auth-side"><div><i class="fa-solid fa-graduation-cap fa-3x"></i><h1>Smart Campus</h1><p>One connected campus for complaints and attendance.</p></div></div>
<div class="auth-form"><h2>Welcome back</h2><p class="text-muted">Sign in to your account</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">Email address</label><input class="form-control" type="email" name="email" required>
<label class="form-label mt-3">Password</label><input class="form-control" type="password" name="password" required>
<button class="btn btn-primary w-100 mt-4">Sign in</button></form>
<p class="mt-3 text-center">New student? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>
{% endblock %}
