{% extends "base.html" %}{% block title %}Register | Smart Campus{% endblock %}{% block content %}
<div class="auth-card wide"><div class="auth-side"><div><i class="fa-solid fa-user-plus fa-3x"></i><h1>Join the campus</h1><p>Create your student account securely.</p></div></div>
<div class="auth-form"><h2>Student registration</h2><form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="name" required></div>
<div class="col-md-6"><label class="form-label">Student email</label><input class="form-control" type="email" name="email" required></div>
<div class="col-md-6"><label class="form-label">Roll number</label><input class="form-control" name="roll_number" required></div>
<div class="col-md-6"><label class="form-label">Department</label><input class="form-control" name="department" required></div>
<div class="col-md-6"><label class="form-label">Academic year</label><select class="form-select" name="year" required><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
<div class="col-md-6"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required></div>
<div class="col-md-12"><label class="form-label">Confirm password</label><input class="form-control" type="password" name="confirm_password" required></div>
<div class="col-12"><button class="btn btn-primary w-100">Create account</button></div></form><p class="mt-3 text-center"><a href="{{ url_for('login') }}">Back to login</a></p></div></div>
{% endblock %}
